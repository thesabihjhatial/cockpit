<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #ffffff;
  font-family: Inter, system-ui, sans-serif;
  font-feature-settings: 'tnum' 1, 'cv11' 1;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

.workspace { display: grid; place-items: center; height: 100vh; padding: 24px; }

.frame {
  position: relative;
  aspect-ratio: 16 / 9;
  width: min(100%, calc((100vh - 48px) * 16 / 9));
  border-radius: 14px;
  box-shadow: 0 0 0 1px #d0d4d9, 0 24px 60px rgba(0, 0, 0, 0.18);
  overflow: hidden;
  background: #f5f5f6;
}

.stage {
  --accent: #d92d20;
  --accent-ink: #b42318;
  --bg: #f5f5f6;
  --line: #d4d4d8;
  --muted: #5e5e66;
  --raised: #efeff1;
  --ring: #e4e4e7;
  --surface: #ffffff;
  --text: #18181b;
  --text2: #3f3f46;
  --track: #e2e2e6;
  position: absolute;
  top: 0;
  left: 0;
  width: 1280px;
  height: 720px;
  transform-origin: 0 0;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.stage[data-theme='dark'] {
  --accent: #e5484d;
  --accent-ink: #ff9592;
  --bg: #0f0f10;
  --line: #3a3a3e;
  --muted: #9e9ea6;
  --raised: #262628;
  --ring: #262628;
  --surface: #1a1a1c;
  --text: #f2f2f3;
  --text2: #c7c7cc;
  --track: #2a2a2d;
}

.screen { position: absolute; inset: 0; transform: scale(0.96); transition: transform 250ms cubic-bezier(0.4, 0, 0.2, 1); }
.screen.ready { transform: scale(1); }
.veil { position: absolute; inset: 0; z-index: 50; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity 125ms linear; }

.home { position: absolute; inset: 0; padding: 32px; display: grid; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 16px; }

.header { display: flex; flex-direction: column; justify-content: center; gap: 6px; min-height: 0; }
.greeting { font-size: 16px; font-weight: 500; color: var(--muted); }
.header-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: center; }
.time-date { display: grid; grid-template-columns: minmax(0, 34fr) minmax(0, 66fr); align-items: center; min-width: 0; }
.time { font-size: 84px; font-weight: 500; letter-spacing: -0.045em; line-height: 0.92; white-space: nowrap; }
.date { display: flex; align-items: center; min-width: 0; min-height: 72px; padding-left: 32px; border-left: 1px solid var(--line); font-size: 26px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date b { font-weight: 600; }
.date span { font-weight: 500; color: var(--text2); }
.status { display: flex; align-items: center; justify-content: flex-end; gap: 28px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; color: var(--text2); white-space: nowrap; }
.chip svg { width: 20px; height: 20px; flex: none; }
.chip.muted { color: var(--muted); }
.chip.bluetooth svg { color: var(--accent-ink); }
.chip.muted svg { color: var(--muted); }
.gear { width: 56px; height: 56px; margin-right: -14px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.gear:active { background: rgba(127, 127, 127, 0.16); }
.gear svg { width: 24px; height: 24px; }

.now { grid-row: span 2; min-height: 0; }
.prompt { height: 100%; display: flex; align-items: center; justify-content: center; gap: 24px; font-size: 20px; font-weight: 500; color: var(--muted); }
.prompt button { padding: 16px 28px; border-radius: 999px; background: var(--surface); color: var(--text); font-size: 18px; font-weight: 600; }
.now-grid { height: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; gap: 16px; }
.art { width: 100%; aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.14); }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
.info { grid-column: span 2; height: 292px; min-width: 0; padding: 6px 0 4px 24px; display: flex; flex-direction: column; justify-content: space-between; }
.info-top { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.source { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--muted); }
.source i { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }
.title { margin: 0; font-size: 48px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.artist { font-size: 24px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info-bottom { display: flex; flex-direction: column; gap: 10px; }
.progress { position: relative; height: 6px; border-radius: 3px; background: var(--track); }
.progress-fill { height: 100%; border-radius: 3px; background: var(--accent); }
.progress-thumb { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 999px; background: var(--accent); }
.times { display: flex; justify-content: space-between; font-size: 15px; font-weight: 500; color: var(--muted); }
.controls { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.control { width: 72px; height: 72px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.control:active { background: rgba(127, 127, 127, 0.16); }
.control svg { width: 34px; height: 34px; }
.control.play { width: 104px; height: 104px; background: var(--accent); color: #ffffff; }
.control.play:active { background: var(--accent); filter: brightness(0.92); }
.control.play svg { width: 40px; height: 40px; }

.dock { min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.slot { min-width: 0; min-height: 0; }
.slot-empty { width: 100%; height: 100%; border-radius: 16px; background: var(--surface); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 20px; font-size: 18px; font-weight: 500; }
.slot-empty .plus { width: 48px; height: 48px; border-radius: 999px; background: var(--raised); display: flex; align-items: center; justify-content: center; }
.slot-empty svg { width: 22px; height: 22px; }

.tile { position: relative; width: 100%; height: 100%; min-width: 0; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 16px; color: #ffffff; }
.tile:active { filter: brightness(0.92); }
.tile-icon svg { width: 48px; height: 48px; display: block; }
.tile-icon { width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 38px; font-weight: 800; letter-spacing: -0.02em; }
.tile-name { min-width: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { position: absolute; top: 12px; right: 12px; height: 22px; padding: 0 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.22); font-size: 11px; font-weight: 600; display: flex; align-items: center; }

.np-tap { grid-column: span 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: 16px; min-width: 0; text-align: left; }
.np-tap .info { grid-column: span 2; }
.home.fading-out > .header,
.home.fading-out > .dock,
.home.fading-out .now .info,
.home.fading-out .now .controls,
.home.fading-out .now .prompt,
.home.fading-out .x-text,
.home.fading-out .x-chevron,
.home.fading-out .viz,
.home.fading-out .x-controls { animation: fade-out 75ms ease-out forwards; }
.home.fading-in > .header,
.home.fading-in > .dock,
.home.fading-in .now .info,
.home.fading-in .now .controls,
.home.fading-in .now .prompt,
.home.fading-in .x-text,
.home.fading-in .x-chevron,
.home.fading-in .viz,
.home.fading-in .x-controls { animation: fade-in 175ms cubic-bezier(0.4, 0, 0.2, 1) 75ms backwards; }
.expanded-view { display: none; }
.home.expanded > .header, .home.expanded > .now, .home.expanded > .dock { display: none; }
.home.expanded > .expanded-view { display: contents; }
.x-info { min-height: 0; display: flex; align-items: center; gap: 24px; text-align: left; }
.x-art { width: 152px; height: 152px; flex: none; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14); }
.x-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.x-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.x-chevron { width: 56px; height: 56px; flex: none; margin-right: -14px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.x-chevron svg { width: 28px; height: 28px; }
.viz { grid-row: span 2; min-height: 0; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); gap: 12px; align-items: end; }
.bar { display: block; transform-origin: bottom center; border-radius: 10px 10px 4px 4px; background: var(--accent); animation: eq ease-in-out infinite; }
.viz.paused .bar { animation-play-state: paused; }
.x-controls { min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.x-progress { display: flex; align-items: center; gap: 16px; font-size: 15px; font-weight: 500; color: var(--muted); }
.x-progress .progress { flex: 1; }
.x-buttons { display: flex; align-items: center; justify-content: center; gap: 40px; }
.control.play.large { width: 96px; height: 96px; }
.control.play.large svg { width: 38px; height: 38px; }
.peek { position: absolute; left: 32px; right: 32px; bottom: 0; height: 32px; z-index: 6; }
.drawer { position: absolute; inset: 0; z-index: 5; transform: translateY(672px); pointer-events: none; }
.drawer.open { pointer-events: auto; }
.drawer.animating { transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1); }
.drawer-bg { position: absolute; inset: 0; background: var(--bg); opacity: 0; }
.drawer.animating .drawer-bg, .drawer.animating .drawer-title { transition: opacity 300ms cubic-bezier(0.4, 0, 0.2, 1); }
.drawer-grid { position: absolute; inset: 0; padding: 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 152px; gap: 16px; align-content: start; overflow-y: auto; scrollbar-width: none; }
.drawer-grid::-webkit-scrollbar { display: none; }
.drawer-title { position: absolute; top: 0; left: 0; right: 0; height: 32px; padding: 0 32px; background: var(--bg); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); opacity: 0; pointer-events: none; }
.drawer-title b { color: var(--text); }
.drawer.open .drawer-title { pointer-events: auto; cursor: pointer; }

.menu { position: absolute; z-index: 30; min-width: 220px; padding: 8px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 16px 40px rgba(0, 0, 0, 0.25); }
.menu button { width: 100%; padding: 14px 16px; border-radius: 10px; font-size: 18px; font-weight: 500; text-align: left; }
.menu button:active { background: var(--raised); }
.menu button:disabled { color: var(--muted); cursor: default; }
.menu[hidden] { display: none; }

.splash { position: absolute; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; transition: opacity 250ms; }
.splash.out { opacity: 0; pointer-events: none; }
.splash-mark { display: flex; flex-direction: column; align-items: center; gap: 24px; }
.splash-mark svg { width: 104px; height: 104px; }
.splash-word { font-size: 44px; font-weight: 700; letter-spacing: 0.26em; margin-right: -0.26em; line-height: 1; }
.splash-status { display: flex; flex-direction: column; align-items: center; gap: 14px; font-size: 15px; font-weight: 500; color: var(--muted); }
.splash-bar { width: 180px; height: 3px; border-radius: 2px; background: var(--ring); overflow: hidden; }
.splash-bar i { display: block; width: 100%; height: 100%; border-radius: 2px; background: var(--accent); transform-origin: left center; animation: fill 3s linear forwards; }
.needle { transform-box: view-box; transform-origin: 24px 24px; animation: sweep 3s linear forwards; }

@keyframes fade-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
@keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes eq { 0% { transform: scaleY(var(--lo)); } 50% { transform: scaleY(1); } 100% { transform: scaleY(var(--lo)); } }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes sweep {
  0% { transform: rotate(-120deg); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  55% { transform: rotate(18deg); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  75% { transform: rotate(0deg); }
  100% { transform: rotate(0deg); }
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 56px;
  transform: translate(-50%, 12px);
  background: #2b2d31;
  color: #ffffff;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms, transform 200ms;
  z-index: 40;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<main class="workspace">
  <div class="frame" id="frame">
    <div class="stage" id="stage" data-theme="light">
      <div class="screen" id="screen">
        <div class="home" id="home">
          <div class="header" id="header"></div>
          <section class="now" id="now" aria-label="Now playing"></section>
          <nav class="dock" id="dock" aria-label="Pinned apps"></nav>
          <div class="expanded-view" id="expandedView"></div>
        </div>
        <button class="peek" id="peek" aria-label="All apps"></button>
        <div class="drawer" id="drawer">
          <div class="drawer-bg" id="drawerBg"></div>
          <div class="drawer-grid" id="grid"></div>
          <div class="drawer-title" id="drawerTitle"></div>
        </div>
      </div>
      <div class="splash" id="splash">
        <div class="splash-mark">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M11.27 36.73 A18 18 0 1 1 36.73 36.73" stroke="var(--ring)" stroke-width="4" stroke-linecap="round"></path>
            <path d="M11.27 36.73 A18 18 0 0 1 24 6" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"></path>
            <g class="needle"><path d="M24 24 L24 11" stroke="var(--text)" stroke-width="3" stroke-linecap="round"></path></g>
            <circle cx="24" cy="24" r="3.6" fill="var(--accent)"></circle>
          </svg>
          <span class="splash-word">COCKPIT</span>
        </div>
        <div class="splash-status">
          <div class="splash-bar"><i></i></div>
          <span>Starting up</span>
        </div>
      </div>
      <div class="menu" id="menu" hidden></div>
      <div class="toast" id="toast"></div>
      <div class="veil" id="veil"></div>
    </div>
  </div>
</main>

  night: params.get('theme') ? params.get('theme') === 'night' : isNight(new Date().getHours()),
  open: false,
  picking: null,
  pinned: loadPinned(),
  playing: true,
  position: 84,
  track: 0,
  wifi: true,
  wifiName: "Sabih's Infinix HOT 50i",
};

const view = { lastMinute: '', scale: 1, suppressClick: false, dipping: false, switching: false };

function applyExpanded() {
  dom.home.classList.toggle('expanded', state.expanded);
  dom.drawer.style.visibility = state.expanded ? 'hidden' : '';
  syncPeek();
}

function applyProgress(progress) {
  dom.drawer.style.transform = 'translateY(' + (1 - progress) * SheetTravel + 'px)';
  dom.drawerBg.style.opacity = progress;
  dom.drawerTitle.style.opacity = progress;
}

function applyScale() {
  view.scale = dom.frame.clientWidth / 1280;
  dom.stage.style.transform = 'scale(' + view.scale + ')';
}

function applyTheme() {
  dom.stage.dataset.theme = state.night ? 'dark' : 'light';
}

function bars() {
  let html = '';
  for (let i = 0; i < 21; i++) {
    const distance = Math.abs(i - 10) / 10;
    const peak = 34 + 62 * Math.cos(distance * Math.PI / 2) + ((i * 37) % 11) - 5;
    const low = (0.22 + ((i * 53) % 30) / 100).toFixed(2);
    const duration = (0.7 + ((i * 29) % 9) / 10).toFixed(2);
    const delay = (((i * 41) % 13) / 10).toFixed(1);
    const opacity = (0.55 + 0.45 * (1 - distance)).toFixed(2);
    html += '<span class="bar" style="height:' + Math.min(100, Math.round(peak)) + '%;opacity:' + opacity + ';--lo:' + low + ';animation-duration:' + duration + 's;animation-delay:-' + delay + 's"></span>';
  }
  return html;
}

function buildGrid() {
  dom.grid.innerHTML = Apps.map(([name, color]) => tile(name, color, true)).join('');
  dom.drawerTitle.innerHTML = '<b>All your apps</b><span>' + Apps.length + '</span>';
}

function clamp(value) {
  return Math.min(1, Math.max(0, value));
}

function closeDrawer() {
  setOpen(false);
}

function dockApp(name) {
  const slot = state.pinned.indexOf(null);
  if (slot < 0) return;
  state.pinned[slot] = name;
  savePinned();
  renderDock();
  buildGrid();
}

function esc(text) {
  return String(text).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}

function formatTime(seconds) {
  const whole = Math.floor(seconds);
  return Math.floor(whole / 60) + ':' + String(whole % 60).padStart(2, '0');
}

function growArt(start, target, radius) {
  if (!start || !target) return;
  const end = target.getBoundingClientRect();
  const scale = start.width / end.width;
  const fromRadius = (radius === ExpandedArtRadius ? CollapsedArtRadius : ExpandedArtRadius) / scale;
  const dx = (start.left - end.left) / view.scale;
  const dy = (start.top - end.top) / view.scale;
  target.animate(
    [
      { borderRadius: fromRadius + 'px', transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')', transformOrigin: '0 0' },
      { borderRadius: radius + 'px', transform: 'none', transformOrigin: '0 0' },
    ],
    { duration: ArtMs, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' },
  );
}

function hideMenu() {
  dom.menu.hidden = true;
}

function icon(name) {
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + Icons[name] + '</svg>';
}

function init() {
  applyTheme();
  applyScale();
  buildGrid();
  renderAll();
  applyProgress(0);
  window.addEventListener('resize', applyScale);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'n') setNight(!state.night);
    if (event.key === 'h') toggleHeadlights();
    if (event.key === 'm') toggleMedia();
    if (event.key === 'a') toggleState('mediaAccess', renderPlayer);
    if (event.key === 'b') toggleState('bluetoothConnected', renderHeader);
    if (event.key === 'p') toggleState('bluetoothPermission', renderHeader);
    if (event.key === 'w') toggleState('wifi', renderHeader);
  });
  bindGestures();
  bindClicks();
  setInterval(tick, 250);
  setTimeout(startReady, SplashDurationMs);
}

function isNight(hour) {
  return hour >= NightStartHour || hour < NightEndHour;
}

function loadPinned() {
  try {
    const saved = JSON.parse(localStorage.getItem(StorageKey)) || DefaultPinned;
    if (Array.isArray(saved)) {
      return Array.from({ length: PinSlots }, (_, slot) => (Apps.some(([name]) => name === saved[slot]) ? saved[slot] : null));
    }
  } catch (error) {
    return DefaultPinned.slice();
  }
  return DefaultPinned.slice();
}

function now() {
  return new Date();
}

function openDrawer(slot = null) {
  state.picking = slot;
  setOpen(true);
}

function pinApp(name, slot) {
  state.pinned = state.pinned.map((pinned) => (pinned === name ? null : pinned));
  state.pinned[slot] = name;
  savePinned();
  renderDock();
  buildGrid();
}

function renderAll() {
  renderHeader();
  renderPlayer();
  renderDock();
}

function renderDock() {
  dom.dock.innerHTML = state.pinned
    .map((name, slot) => {
      const app = Apps.find(([appName]) => appName === name);
      const content = app
        ? tile(app[0], app[1], false, slot)
        : '<button class="slot-empty" data-slot="' + slot + '" aria-label="Add app"><span class="plus">' + icon('add') + '</span>Add app</button>';
      return '<div class="slot">' + content + '</div>';
    })
    .join('');
}

function renderExpanded() {
  if (!state.mediaAccess || !state.mediaVisible) {
    state.expanded = false;
    dom.expandedView.innerHTML = '';
    applyExpanded();
    return;
  }
  const track = Tracks[state.track];
  dom.expandedView.innerHTML =
    '<button class="x-info" data-action="collapse" aria-label="Collapse now playing">' +
    '<span class="x-art" aria-hidden="true"><img src="' + track.art + '" alt=""></span>' +
    '<span class="x-text"><span class="source"><i></i>Now playing · ' + esc(track.source) + '</span>' +
    '<span class="title">' + esc(track.title) + '</span><span class="artist">' + esc(track.artist) + '</span></span>' +
    '<span class="x-chevron" aria-hidden="true">' + icon('chevron') + '</span></button>' +
    '<button class="viz' + (state.playing ? '' : ' paused') + '" data-action="collapse" aria-label="Collapse now playing">' + bars() + '</button>' +
    '<div class="x-controls"><div class="x-progress"><span class="elapsed"></span>' +
    '<div class="progress"><div class="progress-fill"></div><span class="progress-thumb"></span></div>' +
    '<span>' + formatTime(track.duration) + '</span></div>' +
    '<div class="x-buttons">' +
    '<button class="control" data-action="previous" aria-label="Previous track">' + icon('previous') + '</button>' +
    '<button class="control play large" data-action="play" aria-label="' + (state.playing ? 'Pause' : 'Play') + '">' + icon(state.playing ? 'pause' : 'play') + '</button>' +
    '<button class="control" data-action="next" aria-label="Next track">' + icon('next') + '</button>' +
    '</div></div>';
  applyExpanded();
  updateProgress();
}

function renderHeader() {
  const current = now();
  const hour = current.getHours();
  const greeting = hour < 5 ? 'Good night' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const minutes = String(current.getMinutes()).padStart(2, '0');
  let bluetooth;
  if (!state.bluetoothPermission) {
    bluetooth = '<button class="chip muted bluetooth" data-action="bluetooth">' + icon('bluetooth') + 'Allow Bluetooth</button>';
  } else if (state.bluetoothConnected) {
    bluetooth = '<span class="chip bluetooth">' + icon('bluetooth') + esc(state.bluetoothDevice) + '</span>';
  } else {
    bluetooth = '<span class="chip muted">' + icon('bluetooth') + 'Not connected</span>';
  }
  const wifi = state.wifi
    ? '<span class="chip">' + icon('wifi') + esc(state.wifiName) + '</span>'
    : '<span class="chip muted">' + icon('wifi') + 'Not connected</span>';
  dom.header.innerHTML =
    '<span class="greeting">' + greeting + '</span>' +
    '<div class="header-row">' +
    '<section class="time-date" aria-label="Time and date"><div><span class="time">' + (hour % 12 || 12) + ':' + minutes + '</span></div>' +
    '<div class="date"><b>' + Days[current.getDay()] + ',</b>&nbsp;<span>' + current.getDate() + ' ' + Months[current.getMonth()] + '</span></div></section>' +
    '<div class="status">' + bluetooth + wifi + '<button class="gear" data-action="settings" aria-label="Settings">' + icon('settings') + '</button></div>' +
    '</div>';
  view.lastMinute = hour + ':' + minutes;
}

function renderNow() {
  if (!state.mediaAccess) {
    dom.now.innerHTML = '<div class="prompt">Allow notification access to show what&#39;s playing<button data-action="media">Allow access</button></div>';
    return;
  }
  if (!state.mediaVisible) {
    dom.now.innerHTML = '';
    return;
  }
  const track = Tracks[state.track];
  dom.now.innerHTML =
    '<div class="now-grid">' +
    '<button class="np-tap" data-action="expand" aria-label="Expand now playing">' +
    '<div class="art" aria-hidden="true"><img src="' + track.art + '" alt=""></div>' +
    '<div class="info"><div class="info-top">' +
    '<span class="source"><i></i>Now playing · ' + esc(track.source) + '</span>' +
    '<h2 class="title">' + esc(track.title) + '</h2><span class="artist">' + esc(track.artist) + '</span></div>' +
    '<div class="info-bottom"><div class="progress"><div class="progress-fill"></div><span class="progress-thumb"></span></div>' +
    '<div class="times"><span class="elapsed"></span><span>' + formatTime(track.duration) + '</span></div></div></div></button>' +
    '<div class="controls">' +
    '<button class="control" data-action="previous" aria-label="Previous track">' + icon('previous') + '</button>' +
    '<button class="control play" data-action="play" aria-label="' + (state.playing ? 'Pause' : 'Play') + '">' + icon(state.playing ? 'pause' : 'play') + '</button>' +
    '<button class="control" data-action="next" aria-label="Next track">' + icon('next') + '</button>' +
    '</div></div>';
  updateProgress();
}

function renderPlayer() {
  renderNow();
  renderExpanded();
}

function savePinned() {
  try {
    localStorage.setItem(StorageKey, JSON.stringify(state.pinned));
  } catch (error) {
    return;
  }
}

function setExpanded(expanded) {
  if (state.expanded === expanded || view.switching) return;
  view.switching = true;
  const from = document.querySelector(expanded ? '.art' : '.x-art');
  const start = from ? from.getBoundingClientRect() : null;
  dom.home.classList.add('fading-out');
  setTimeout(() => {
    state.expanded = expanded;
    applyExpanded();
    dom.home.classList.remove('fading-out');
    dom.home.classList.add('fading-in');
    growArt(start, document.querySelector(expanded ? '.x-art' : '.art'), expanded ? ExpandedArtRadius : CollapsedArtRadius);
    setTimeout(() => {
      dom.home.classList.remove('fading-in');
      view.switching = false;
    }, Math.max(ArtMs, FadeOutMs + FadeInMs));
  }, FadeOutMs);
}

function setNight(night) {
  if (state.night === night || view.dipping) return;
  view.dipping = true;
  dom.veil.style.transitionDuration = ThemeInMs + 'ms';
  dom.veil.style.opacity = 1;
  setTimeout(() => {
    state.night = night;
    applyTheme();
    dom.veil.style.transitionDuration = ThemeOutMs + 'ms';
    dom.veil.style.opacity = 0;
    setTimeout(() => {
      view.dipping = false;
    }, ThemeOutMs);
  }, ThemeInMs);
}

function setOpen(open) {
  state.open = open;
  if (!open) state.picking = null;
  dom.drawer.classList.add('animating');
  dom.drawer.classList.toggle('open', open);
  syncPeek();
  applyProgress(open ? 1 : 0);
  if (!open) dom.grid.scrollTop = 0;
}

function showMenu(tileEl) {
  const name = tileEl.dataset.app;
  const docked = state.pinned.includes(name);
  const full = !state.pinned.includes(null);
  const items = docked
    ? [['Remove from dock', 'undock', false]]
    : [[full ? 'Dock is full' : 'Add to dock', 'dock', full]];
  dom.menu.innerHTML = items
    .map(([label, action, disabled]) => '<button data-menu="' + action + '" data-app="' + esc(name) + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button>')
    .join('');
  const stageBox = dom.stage.getBoundingClientRect();
  const box = tileEl.getBoundingClientRect();
  dom.menu.style.left = Math.min(1280 - 240, (box.left - stageBox.left) / view.scale + 24) + 'px';
  dom.menu.style.top = Math.min(720 - 100, (box.top - stageBox.top) / view.scale + 24) + 'px';
  dom.menu.hidden = false;
}

function showToast(message) {
  dom.toast.textContent = message;
  dom.toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => dom.toast.classList.remove('show'), 1600);
}

function startReady() {
  dom.splash.classList.add('out');
  dom.screen.classList.add('ready');
  setTimeout(() => dom.splash.remove(), SplashExitMs);
}

function syncPeek() {
  dom.peek.hidden = state.open || state.expanded;
}

function tick() {
  if (state.playing && state.mediaVisible) {
    state.position += 0.25;
    if (state.position >= Tracks[state.track].duration) {
      state.track = (state.track + 1) % Tracks.length;
      state.position = 0;
      renderPlayer();
    } else {
      updateProgress();
    }
  }
  const current = now();
  const minute = current.getHours() + ':' + String(current.getMinutes()).padStart(2, '0');
  if (minute !== view.lastMinute) renderHeader();
}

function tile(name, color, withBadge, slot) {
  const badge = withBadge && state.pinned.includes(name) ? '<span class="badge">Docked</span>' : '';
  const slotAttr = slot === undefined ? '' : ' data-slot="' + slot + '"';
  return '<button class="tile" data-app="' + esc(name) + '"' + slotAttr + ' style="background:' + color + '" aria-label="' + esc(name) + '">' +
    '<span class="tile-icon">' + tileGlyph(name) + '</span><span class="tile-name">' + esc(name) + '</span>' + badge + '</button>';
}

function tileGlyph(name) {
  const glyph = Glyphs[name];
  if (!glyph) return esc(name.charAt(0));
  return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="' + glyph.path + '"/></svg>';
}

function syncPlayback() {
  const play = document.querySelector('.x-buttons .play');
  if (play) {
    play.innerHTML = icon(state.playing ? 'pause' : 'play');
    play.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
  }
  const viz = document.querySelector('.viz');
  if (viz) viz.classList.toggle('paused', !state.playing);
}

function toggleHeadlights() {
  state.headlights = !state.headlights;
  setNight(state.headlights || isNight(new Date().getHours()));
}

function toggleMedia() {
  state.mediaVisible = !state.mediaVisible;
  renderPlayer();
}

function toggleState(key, render) {
  state[key] = !state[key];
  render();
}

function undockApp(name) {
  state.pinned = state.pinned.map((pinned) => (pinned === name ? null : pinned));
  savePinned();
  renderDock();
  buildGrid();
}

function updateProgress() {
  const track = Tracks[state.track];
  const fraction = clamp(state.position / track.duration) * 100;
  document.querySelectorAll('.progress-fill').forEach((fill) => {
    fill.style.width = fraction + '%';
  });
  document.querySelectorAll('.progress-thumb').forEach((thumb) => {
    thumb.style.left = fraction + '%';
  });
  document.querySelectorAll('.elapsed').forEach((elapsed) => {
    elapsed.textContent = formatTime(state.position);
  });
}

function bindClicks() {
  dom.stage.addEventListener('click', (event) => {
    if (view.suppressClick) {
      event.stopPropagation();
      event.preventDefault();
      return;
    }
    const menuItem = event.target.closest('[data-menu]');
    if (menuItem) {
      if (menuItem.dataset.menu === 'dock') dockApp(menuItem.dataset.app);
      else undockApp(menuItem.dataset.app);
      hideMenu();
      return;
    }
    hideMenu();
    if (event.target.closest('#peek')) {
      openDrawer();
      return;
    }
    if (event.target.closest('#drawerTitle')) {
      closeDrawer();
      return;
    }
    const empty = event.target.closest('.slot-empty');
    if (empty) {
      openDrawer(Number(empty.dataset.slot));
      return;
    }
    const action = event.target.closest('[data-action]');
    if (action) {
      runAction(action.dataset.action);
      return;
    }
    const app = event.target.closest('.tile');
    if (!app) return;
    if (!app.closest('#grid')) {
      showToast('Launching ' + app.dataset.app);
    } else if (state.picking !== null) {
      pinApp(app.dataset.app, state.picking);
      showToast('Docked ' + app.dataset.app);
      closeDrawer();
    } else {
      showToast('Launching ' + app.dataset.app);
      closeDrawer();
    }
  }, true);
}

function bindGestures() {
  let gesture = null;
  const release = (event) => {
    const g = gesture;
    gesture = null;
    clearTimeout(g.hold);
    if (g.mode || g.held) {
      view.suppressClick = true;
      setTimeout(() => {
        view.suppressClick = false;
      }, 0);
    }
    if (g.mode !== 'open' && g.mode !== 'close') return;
    const dy = (event.clientY - g.y) / view.scale;
    const last = g.samples[g.samples.length - 1];
    const recent = g.samples.find((sample) => last.t - sample.t <= 100);
    const velocity = recent && last.t > recent.t ? (last.y - recent.y) / view.scale / (last.t - recent.t) : 0;
    const progress = clamp(g.progress - dy / SheetTravel);
    const open = velocity < -FlingVelocity ? true : velocity > FlingVelocity ? false : progress >= 0.5;
    setOpen(open);
  };
  dom.stage.addEventListener('pointerdown', (event) => {
    if (event.button > 0) return;
    if (!event.target.closest('#menu')) hideMenu();
    gesture = {
      id: event.pointerId,
      mode: null,
      progress: state.open ? 1 : 0,
      samples: [{ t: performance.now(), y: event.clientY }],
      scroll: dom.grid.scrollTop,
      x: event.clientX,
      y: event.clientY,
    };
    const tileEl = event.target.closest('.tile');
    if (tileEl && (!tileEl.closest('#grid') || state.open)) {
      gesture.hold = setTimeout(() => {
        if (!gesture || gesture.mode) return;
        gesture.held = true;
        showMenu(tileEl);
      }, HoldMs);
    }
  });
  dom.stage.addEventListener('pointermove', (event) => {
    if (!gesture || event.pointerId !== gesture.id) return;
    const dx = (event.clientX - gesture.x) / view.scale;
    const dy = (event.clientY - gesture.y) / view.scale;
    gesture.samples.push({ t: performance.now(), y: event.clientY });
    if (!gesture.mode && Math.hypot(dx, dy) >= DragSlop) {
      clearTimeout(gesture.hold);
      if (Math.abs(dy) <= Math.abs(dx)) gesture.mode = 'none';
      else if (!state.open && !state.expanded && dy < 0) gesture.mode = 'open';
      else if (state.open && dy > 0 && gesture.scroll === 0) gesture.mode = 'close';
      else gesture.mode = state.open ? 'scroll' : 'none';
      if (gesture.mode === 'open' || gesture.mode === 'close') dom.drawer.classList.remove('animating');
      if (gesture.mode !== 'none') {
        try {
          dom.stage.setPointerCapture(event.pointerId);
        } catch (error) {
          return;
        }
      }
    }
    if (gesture.mode === 'open' || gesture.mode === 'close') applyProgress(clamp(gesture.progress - dy / SheetTravel));
    else if (gesture.mode === 'scroll') dom.grid.scrollTop = gesture.scroll - dy;
  });
  dom.stage.addEventListener('pointerup', (event) => {
    if (gesture && event.pointerId === gesture.id) release(event);
  });
  dom.stage.addEventListener('pointercancel', (event) => {
    if (!gesture || event.pointerId !== gesture.id) return;
    clearTimeout(gesture.hold);
    if (gesture.mode === 'open' || gesture.mode === 'close') setOpen(state.open);
    gesture = null;
  });
}

function runAction(action) {
  if (action === 'bluetooth') {
    state.bluetoothPermission = true;
    showToast('Bluetooth permission granted');
    renderHeader();
  } else if (action === 'collapse') {
    setExpanded(false);
  } else if (action === 'expand') {
    setExpanded(true);
  } else if (action === 'media') {
    state.mediaAccess = true;
    renderPlayer();
  } else if (action === 'next') {
    state.track = (state.track + 1) % Tracks.length;
    state.position = 0;
    renderPlayer();
  } else if (action === 'play') {
    state.playing = !state.playing;
    renderNow();
    syncPlayback();
  } else if (action === 'previous') {
    if (state.position <= 3) state.track = (state.track + Tracks.length - 1) % Tracks.length;
    state.position = 0;
    renderPlayer();
  } else if (action === 'settings') {
    showToast('Opening Settings');
  }
}

init();
</script>
</body>
</html>
