name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A queued run for the same branch is superseded by the newest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # Lint is a gate, not advice: it has caught API-level and permission
      # mistakes that lintVital (which runs inside the release build) does not.
      - name: Lint
        run: ./gradlew lint --console=plain

      - name: Release build
        run: ./gradlew assembleRelease --console=plain

      # Without keystore.properties the release is debug-signed, which is fine for
      # QA but cannot replace an installed copy. Add the keystore as secrets when
      # you want CI to produce an installable artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
